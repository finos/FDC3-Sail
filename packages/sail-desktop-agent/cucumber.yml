default:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "not @failing"

# CI: full reporters for artifacts and junit consumers
ci:
  format:
    - html:cucumber-report.html
    - "@cucumber/pretty-formatter"
    - junit:test-results.xml
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "not @failing"

# Profile for running all features (default behavior)
all:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "not @failing"

# Profile for running only scenarios tagged @failing (for fixing them)
failing:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "@failing"

# FDC3 version filters (cumulative: each version includes all prior versions'
# scenarios, since FDC3 itself is cumulative). Every scenario carries exactly one
# scenario-level @fdc3_X.Y tag for the version that introduced its behaviour.
fdc3-2.0:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "@fdc3_2.0 and not @failing"

fdc3-2.1:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "(@fdc3_2.0 or @fdc3_2.1) and not @failing"

fdc3-2.2:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "(@fdc3_2.0 or @fdc3_2.1 or @fdc3_2.2) and not @failing"

fdc3-3.0:
  format:
    - "@cucumber/pretty-formatter"
  paths:
    - test/features
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "(@fdc3_2.0 or @fdc3_2.1 or @fdc3_2.2 or @fdc3_3.0) and not @failing"

# Profile for running a single feature (no default paths)
single:
  format:
    - "@cucumber/pretty-formatter"
  require:
    - test/step-definitions/*.steps.ts
    - test/support/*.ts
    - test/world/index.ts
  requireModule:
    - tsx/cjs
  tags: "not @failing"
