<!doctype html>
<html lang="en">
  <head>
    <title>WSCP Listener Demo</title>
    <meta charset="UTF-8" />
    <script type="module" src="./src/index.ts"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      code {
        display: block;
        background: #f4f4f4;
        padding: 0.5rem;
        margin: 0.5rem 0;
        word-break: break-all;
      }
      .status {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 6px;
        background: #eef6ff;
      }
    </style>
  </head>
  <body>
    <h1>WSCP Listener Demo</h1>
    <p>
      This app <strong>listens</strong> for an incoming WebSocket from Sail
      (DA-initiated connection, flows 3–4). Copy the values below into Sail's
      <em>Connect to native app</em>
      dialog.
    </p>
    <p><strong>WebSocket URL</strong></p>
    <code id="ws-url">Loading…</code>
    <p><strong>Shared secret</strong></p>
    <code id="shared-secret">Loading…</code>
    <div class="status" id="status">Waiting for connection…</div>
  </body>
</html>
