version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies"]
    groups:
      # One PR for all open security fixes instead of one PR per package.
      # Routine major bumps are not grouped below, so each breaking change gets its own PR.
      security:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-patches:
        dependency-type: production
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
