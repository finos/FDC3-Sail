version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies"]
    groups:
      # Group by risk (minor/patch) and by dependency type (dev/prod).
      # Major bumps match no group, so each breaking change gets its own PR.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      security-dev:
        applies-to: security-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      security-prod:
        applies-to: security-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/sail-browser-agent
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-conformance-harness
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-env
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-finance
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-headless-agent
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-one
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-platform
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-theme
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-v2-common
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /packages/sail-v2-web
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: daily
