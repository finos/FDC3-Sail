version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies"]
    groups:
      # Group by risk (minor/patch) and by dependency type (dev/prod).
      # Major bumps match no group, so each breaking change gets its own PR.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      security-dev:
        applies-to: security-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      security-prod:
        applies-to: security-updates
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

  # Hash-pinned Semgrep install for .github/workflows/semgrep.yml
  - package-ecosystem: pip
    directory: "/.github"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      semgrep:
        patterns: ["*"]
