# SEMGREP_APP_TOKEN is OPTIONAL: Semgrep AppSec Platform > Settings (or help@finos.org for
# FINOS repos). When set, it adds Semgrep's platform rules on top of the local p/* packs below.
# SARIF upload needs repo Settings → Actions → Workflow permissions to allow security events.
name: Semgrep

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    # Do not use a job-level container: semgrep/semgrep has no Node.js, so
    # github/codeql-action/upload-sarif runs on the host and cannot see files
    # written only inside the container workspace (semgrep.sarif "missing").
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep CI
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep ci --config p/typescript --config p/javascript --config p/react \
            --sarif --sarif-output=reports/semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # failure() alone is unsafe: any earlier step failure (checkout, pip, …) still
      # triggers upload-sarif, but semgrep.sarif was never written.
      - name: Check SARIF output
        id: sarif
        if: always()
        run: |
          f="reports/semgrep.sarif"
          if [ -f "$f" ] && [ -s "$f" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 #v4.37.9
        if: |
          steps.sarif.outputs.ok == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: reports/semgrep.sarif
