# Step 2 of 2: posts the Dependency Diff (Analyze) result as a PR comment.
# Split out because fork and Dependabot PRs only get a read-only token.
# This workflow never checks out or runs PR code; it only reads a JSON file.
name: Dependency Diff (Comment)

on:
  # Safe here: no PR code is checked out or run, and the artifact's PR number
  # is verified against the run's head SHA below.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Dependency Diff (Analyze)"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifact from the analyze run
      pull-requests: write # post the comment
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download result
        id: download
        continue-on-error: true # no artifact means no dependency changes to report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e18e-diff-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact comes from untrusted PR code, so check that its PR number
      # really belongs to the commit this run analysed before commenting.
      - name: Verify PR number
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(jq -r '.pr_number' e18e-diff-result.json)
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Artifact PR number is not a number"
            exit 1
          fi
          pr_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          if [ "$pr_sha" != "$HEAD_SHA" ]; then
            echo "::error::PR #$pr head ($pr_sha) does not match analysed commit ($HEAD_SHA)"
            exit 1
          fi

      - name: Post comment
        if: steps.download.outcome == 'success'
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1.7.1
        with:
          mode: comment-from-artifact
          artifact-path: e18e-diff-result.json
