# Step 1 of 2: summarises dependency changes on a PR (new packages, install
# size, duplicates, trust downgrades, and e18e-suggested native or lighter
# replacements). Runs with a read-only token so it is safe on fork and
# Dependabot PRs; dependency-diff-comment.yml posts the result.
# See https://github.com/e18e/action-dependency-diff
name: Dependency Diff (Analyze)

on:
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Full history so the lockfile can be diffed against the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze dependencies
        id: analyze
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1.7.1
        with:
          mode: artifact

      - name: Upload result
        if: steps.analyze.outputs.artifact-path
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e18e-diff-result
          path: ${{ steps.analyze.outputs.artifact-path }}
          retention-days: 1
