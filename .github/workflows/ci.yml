name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    # setup-node cache: npm persists/restores npm cache via the Actions cache API
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format

      # Must run before lint and typecheck. `@finos/sail-desktop-agent` and
      # `@finos/sail-platform` publish their types from `dist` (`"types": "./dist/index.d.mts"`),
      # and `dist` is gitignored — so on a clean runner every consumer package fails with
      # TS2307 until these are built. Measured: without `dist`, `npm run lint` reports 140
      # errors and `npm run typecheck` exits 2; with it, both are clean.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Knip (unused files, exports and dependencies)
        run: npm run knip -- --no-exit-code

      - name: Docs conformance inventory
        run: npm run conformance:inventory:check -w @finos/sail-docs

      - name: Build docs site
        run: npm run docs:build

      - name: Test (Vitest)
        run: npm test -- --run

      - name: Test (Cucumber)
        run: npm run test:cucumber -w @finos/sail-desktop-agent
