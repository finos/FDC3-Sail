name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format

      # Must run before lint and typecheck. `@finos/sail-browser-agent` and
      # `@finos/sail-platform` publish their types from `dist` (`"types": "./dist/index.d.mts"`),
      # and `dist` is gitignored — so on a clean runner every consumer package fails with
      # TS2307 until these are built. Measured: without `dist`, `npm run lint` reports 140
      # errors and `npm run typecheck` exits 2; with it, both are clean.
      - name: Build
        run: npm run build

      # OSPS-LE-03.02: every published npm tarball must ship the license. npm only
      # auto-includes a LICENSE from the package's own folder, never the repo root.
      - name: Check public packages include LICENSE
        run: |
          status=0
          for pkg in packages/*/package.json; do
            dir="$(dirname "$pkg")/"
            if [ "$(node -p "require('./${pkg}').private === true")" = "true" ]; then
              continue
            fi
            if ! (cd "$dir" && npm pack --dry-run --json | node -e '
              const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files;
              process.exit(files.some((f) => f.path === "LICENSE") ? 0 : 1);
            '); then
              echo "::error file=${dir}package.json::${dir} is public but its npm tarball has no LICENSE file"
              status=1
            fi
          done
          exit $status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Knip (unused files, exports and dependencies)
        run: npm run knip -- --no-exit-code

      - name: Build docs site
        run: npm run docs:build

      - name: Test (Vitest, with coverage)
        run: npm test -- --run --coverage

      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

      - name: Test (Cucumber)
        run: npm run test -w @finos/sail-headless-agent

  # Separate job so the OIDC token (id-token: write) is never available to the
  # `ci` job, which installs and runs third-party npm code.
  codecov:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Codecov needs the git history to match the report to the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # OIDC instead of a CODECOV_TOKEN secret. PRs from forks get no OIDC token;
      # the action falls back to Codecov's tokenless upload for public-repo forks.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          # The gate is Codecov's `patch` status check, not this step, so a
          # Codecov outage doesn't turn CI red on its own.
          fail_ci_if_error: false
