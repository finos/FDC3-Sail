name: FDC3 Conformance

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3 AM UTC
  workflow_dispatch: # Allow manual triggering

# Default: least privilege. This job only reads the repo and writes its own artifacts.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    runs-on: ubuntu-latest
    # A full suite run is ~5 minutes; the ceiling covers install, browser download and a
    # hung agent (playwright.config.ts allows the test itself 15 minutes).
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium: playwright.config.ts declares a single chromium project, and the suite
      # opens real popup windows so it does not run cross-browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The harness resolves @finos/sail-desktop-agent from its `dist`, not its `src`, and
      # `dist` is gitignored — so on a clean runner the agent must be built first. The
      # webServer command does this too, but building here surfaces a build failure as a
      # build failure rather than as a webServer timeout.
      - name: Build desktop agent
        run: npm run build -w @finos/sail-desktop-agent

      # Fails on any regression against e2e/conformance-baseline-2.2.json, which is
      # currently empty — every one of the 83 tests must pass. The spec asserts on the
      # conformance.json payload, not on the screenshot: during development a stale JSON, a
      # contaminated run and a plausible-looking-but-mostly-blank PNG each gave a confident
      # wrong answer.
      - name: Run FDC3 2.2 conformance suite
        run: npm run test:conformance -w @finos/sail-conformance-harness

      # `if: always()` so a failing run still uploads conformance.json, the diff and the
      # screenshot — those are what you need to diagnose it.
      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-results
          path: |
            packages/sail-conformance-harness/artifacts/
            packages/sail-conformance-harness/test-results/
          retention-days: 30
          if-no-files-found: warn
