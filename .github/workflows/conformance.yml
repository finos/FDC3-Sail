name: FDC3 Conformance

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # Nightly at 3 AM UTC
  workflow_dispatch: # Allow manual triggering

# Default: least privilege. This job only reads the repo and writes its own artifacts.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fdc3_version: ["2.2", "3.0"]
    # A full suite run is ~5–7 minutes; the ceiling covers install, browser download and a
    # hung agent (playwright.config.ts allows the test itself 15 minutes).
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium: playwright.config.ts declares a single chromium project, and the suite
      # opens real popup windows so it does not run cross-browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Agent resolves @finos/sail-headless-agent from its dist; harness resolves
      # @finos/sail-browser-agent from dist. Build both before the suite.
      - name: Build desktop agent
        run: |
          npm run build -w @finos/sail-headless-agent
          npm run build -w @finos/sail-browser-agent

      # Local toolbox packages (@robmoffat/fdc3-conformance-{2.2|3.0}) are served same-origin
      # on :3001. Fails on any regression against e2e/conformance-baseline-${version}.json.
      - name: Run FDC3 ${{ matrix.fdc3_version }} conformance suite
        env:
          CONFORMANCE_FDC3_VERSION: ${{ matrix.fdc3_version }}
          VITE_CONFORMANCE_FDC3_VERSION: ${{ matrix.fdc3_version }}
        run: npm run test:conformance -w @finos/sail-conformance-harness

      # `if: always()` so a failing run still uploads conformance.json, the diff and the
      # screenshot — those are what you need to diagnose it.
      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-results-${{ matrix.fdc3_version }}
          path: |
            packages/sail-conformance-harness/artifacts/
            packages/sail-conformance-harness/test-results/
          retention-days: 30
          if-no-files-found: warn
