name: OpenSSF Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # SCORECARD_TOKEN should be a fine-grained PAT with read access to
          # administration; without it, Branch-Protection cannot be evaluated
          # because the default GITHUB_TOKEN can't read classic branch protection.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
