name: OpenSSF Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # SCORECARD_TOKEN should be a fine-grained PAT with read access to
          # administration; without it, Branch-Protection cannot be evaluated
          # because the default GITHUB_TOKEN can't read classic branch protection.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
