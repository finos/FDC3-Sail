name: OSPS Security Assessment

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Mondays at 9 AM UTC
  workflow_dispatch: # Allow manual triggering

# Default: least privilege. This job adds only the write scopes its steps need.
permissions:
  contents: read

jobs:
  osps-assessment:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # code-scanning / Advanced Security SARIF upload (osps-baseline-action upload-sarif)
      security-events: write
      # actions/upload-artifact
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open Source Project Security Baseline Scanner
        uses: revanite-io/osps-baseline-action@d0d850b592f1788b2631f1dfdf84d80ea8c720f5 # v1.5.3
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          # The built-in token is what the OSSF reference workflow uses. A PAT with
          # admin:org would additionally let the scanner observe branch protection
          # and org MFA (OSPS-AC-03), which stay unresolved without one.
          token: ${{ github.token }}
          catalog: "osps-baseline-2026-02"
          upload-sarif: "true"

      - name: Upload Assessment Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osps-assessment-results-${{ github.run_number }}
          path: evaluation_results/
          retention-days: 30
